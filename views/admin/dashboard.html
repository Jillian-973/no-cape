<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Dashboard admin</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.3/dist/index.global.js"
    integrity="sha384-2ql948lIdLcGEE0/qxNiudyTjgauA3RDJERu5xW75kFCvSl5a9odyQYCb6tEjnmB" crossorigin="anonymous"></script>
  <script src="/admin/dashboard.js" defer></script>
</head>
<body class="min-h-screen bg-slate-50 text-slate-800">

  <header class="border-b border-slate-200 bg-white">
    <div class="mx-auto flex max-w-6xl flex-wrap items-center justify-between gap-4 px-4 py-5">
      <div>
        <h1 class="text-2xl font-bold">Dashboard des réservations</h1>
        <p class="text-sm text-slate-500">Connecté en tant que <span id="admin-identifiant" class="font-medium">…</span></p>
      </div>
      <div class="flex items-center gap-3 text-sm">
        <a href="/" class="text-indigo-600 hover:underline">Voir le site</a>
        <button id="bouton-deconnexion" type="button"
          class="cursor-pointer rounded-lg border border-slate-300 bg-white px-4 py-2 font-medium hover:bg-slate-100">
          Déconnexion
        </button>
      </div>
    </div>
  </header>

  <main class="mx-auto max-w-6xl space-y-6 px-4 py-8">

    <div class="flex flex-wrap items-center justify-between gap-4">
      <div id="filtres-etat" class="flex flex-wrap gap-2 text-sm">
        <button type="button" data-filtre="" class="rounded-full border px-3 py-1">Toutes</button>
        <button type="button" data-filtre="en location" class="rounded-full border px-3 py-1">En location</button>
        <button type="button" data-filtre="à venir" class="rounded-full border px-3 py-1">À venir</button>
        <button type="button" data-filtre="rendue" class="rounded-full border px-3 py-1">Rendues</button>
        <button type="button" data-filtre="probleme" class="rounded-full border px-3 py-1">Invalides</button>
      </div>
      <input id="recherche" type="search" placeholder="Rechercher (client, mail, casquette…)" maxlength="100"
        class="w-full rounded-lg border border-slate-300 bg-white px-3 py-2 text-sm focus:border-indigo-500 focus:outline-none focus:ring-2 focus:ring-indigo-200 sm:w-72" />
    </div>

    <p id="reservations-message" class="text-sm text-slate-500">Chargement…</p>
    <div id="reservations-grid" class="grid gap-4 md:grid-cols-2 lg:grid-cols-3"></div>

  </main>

  <!-- Modale : signaler un problème sur une réservation -->
  <dialog id="modale-probleme"
    class="m-auto w-[calc(100%-2rem)] max-w-md rounded-xl border border-slate-200 bg-white p-0 text-slate-800 shadow-xl backdrop:bg-slate-900/50">
    <form id="probleme-form" class="space-y-4 p-6">
      <div>
        <h2 class="text-lg font-semibold">Signaler un problème</h2>
        <p id="probleme-contexte" class="text-sm text-slate-500"></p>
      </div>

      <p class="rounded-lg bg-amber-50 p-3 text-sm text-amber-800">
        Les articles signalés ne reviendront pas dans le stock.
      </p>

      <label class="block">
        <span class="mb-1 block text-sm font-medium">Nombre d'articles ayant un problème</span>
        <input name="quantite" type="number" min="1" step="1" value="1" required
          class="w-full rounded-lg border border-slate-300 px-3 py-2 focus:border-indigo-500 focus:outline-none focus:ring-2 focus:ring-indigo-200" />
      </label>

      <label class="block">
        <span class="mb-1 block text-sm font-medium">Détail du problème</span>
        <textarea name="details" rows="4" required maxlength="1000"
          placeholder="Ex : casquette rendue déchirée, visière cassée…"
          class="w-full rounded-lg border border-slate-300 px-3 py-2 focus:border-indigo-500 focus:outline-none focus:ring-2 focus:ring-indigo-200"></textarea>
      </label>

      <p id="probleme-message" class="hidden text-sm"></p>

      <div class="flex justify-end gap-3">
        <button id="probleme-annuler" type="button"
          class="cursor-pointer rounded-lg border border-slate-300 px-4 py-2 font-medium hover:bg-slate-100">
          Annuler
        </button>
        <button type="submit"
          class="cursor-pointer rounded-lg bg-red-600 px-4 py-2 font-medium text-white hover:bg-red-700 disabled:cursor-not-allowed disabled:opacity-50">
          Signaler
        </button>
      </div>
    </form>
  </dialog>
</body>
</html>
